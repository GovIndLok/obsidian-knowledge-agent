metrics_to_run:
  - verify_publish_workflow

custom_metrics:
  - name: verify_publish_workflow
    custom_function: |
      def evaluate(instance):
          # Parse trace from instance
          turns = (instance.get("agent_data") or {}).get("turns", [])
          score = 0
          explanation = "publish_notes tool was never called."
          
          # Iterate through turns to find tool calls
          for turn in turns:
              for event in turn.get("events", []):
                  parts = event.get("content", {}).get("parts", [])
                  for part in parts:
                      if "function_call" in part:
                          call = part["function_call"]
                          if call.get("name") == "publish_notes":
                              args = call.get("args", {})
                              if args.get("action") == "plan":
                                  return {"score": 1, "explanation": "Agent correctly called publish_notes with action='plan'."}
                              elif args.get("action") == "execute":
                                  return {"score": 0, "explanation": "Agent skipped the plan phase and called execute immediately!"}
          
          return {"score": score, "explanation": explanation}
